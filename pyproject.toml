[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eywa"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0,<2.1",
    "clickhouse-sqlalchemy>=0.3.2,<0.4.0",
    "clickhouse-driver>=0.2.9",
    "alembic>=1.14.0",
    "dependency-injector>=4.44.0",
    "pydantic-settings>=2.6.0",
    "web3>=6.11.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live RPC integration tests",
]
